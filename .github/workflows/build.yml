name: Build
on:
  push:
    branches: [main*]
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Verify Keycloak configuration fixtures
        run: bash scripts/keycloak/verify-keycloak-offline.sh

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'

      - name: Verify chart scripts with coverage
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/tests/requirements.txt
          helm dependency build deploy/charts/mcp-server
          python -m coverage run -m unittest discover -s deploy/tests -p 'test_*.py' -v
          python -m coverage combine
          python -m coverage report
          python -m coverage xml

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Same scope as the pull-request analysis in sonar.yml.
        run: >-
          mvn -B -U verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          -Dsonar.sources=.
          "-Dsonar.exclusions=src/test/**,deploy/tests/**,scripts/keycloak/verify-keycloak-offline.sh,target/**"
          -Dsonar.tests=src/test/java,deploy/tests,scripts/keycloak/verify-keycloak-offline.sh
          -Dsonar.python.coverage.reportPaths=target/python-coverage.xml

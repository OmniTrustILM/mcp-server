name: "Check PR"
on:
  pull_request:
    branches: [main*]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}-build-pr
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for better Sonar analysis relevancy

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build
        run: mvn -B -U verify

      # Package up PR context for downstream workflow_run (Sonar handoff).
      # Values go through env (not inline ${{ }} in the script) and jq --arg, so
      # an unusual branch/repo name can neither inject shell nor break the JSON.
      - name: Prepare PR context artifact
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          jq -n \
            --arg pr_number "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --arg head_repo "$HEAD_REPO" \
            --arg head_branch "$HEAD_BRANCH" \
            --arg base_ref "$BASE_REF" \
            --arg run_id "$RUN_ID" \
            '{pr_number: $pr_number, head_sha: $head_sha, head_repo: $head_repo, head_branch: $head_branch, base_ref: $base_ref, run_id: $run_id}' \
            > pr-context.json
          cat pr-context.json

      - name: Upload PR context
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-context
          path: pr-context.json
          retention-days: 1
          if-no-files-found: error

      - name: Upload compiled classes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiled-classes
          path: target/classes
          retention-days: 1
          if-no-files-found: error

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: target/site/jacoco/jacoco.xml
          retention-days: 1
          if-no-files-found: error

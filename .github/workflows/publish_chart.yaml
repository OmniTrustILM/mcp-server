name: Publish Chart
on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Main publications share one concurrency group for the floating tag update.
  group: chart-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish and sign the MCP chart
    # Manual dispatch from feature branches cannot access publication credentials.
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate, test and package chart
        id: package
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python -m pip install -r deploy/tests/requirements.txt
          helm dependency build deploy/charts/mcp-server
          python -m unittest discover -s deploy/tests -p 'test_*.py' -v
          helm lint deploy/charts/mcp-server --strict --values deploy/charts/mcp-server/ci/default-values.yaml
          version=$(python deploy/scripts/chart_version.py --ref-type "$REF_TYPE" --ref-name "$REF_NAME" --sha "$GITHUB_SHA")
          mkdir -p dist
          helm package deploy/charts/mcp-server --version "$version" --destination dist
          echo "archive=dist/mcp-server-$version.tgz" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Publish and sign exact OCI digest
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          VERSION: ${{ steps.package.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          HELM_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          HELM_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/chart-registry/config.json
          DOCKER_CONFIG: ${{ runner.temp }}/chart-registry
        run: |
          set -euo pipefail
          registry=hub.omnitrustregistry.com
          trap 'helm registry logout "$registry"' EXIT
          printf '%s' "$HELM_PASSWORD" | helm registry login "$registry" --username "$HELM_USERNAME" --password-stdin
          # Helm 4 writes push metadata to stderr. Capture both streams and retain
          # pipefail so a failed push cannot be mistaken for a successful publish.
          helm push "$ARCHIVE" "oci://$registry/ilm-helm" 2>&1 | tee "$RUNNER_TEMP/chart-push.log"
          digest=$(python deploy/scripts/push_digest.py < "$RUNNER_TEMP/chart-push.log")
          # Helm and Cosign share the temporary Docker-compatible credential file.
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$registry/ilm-helm/mcp-server@$digest"
          if [[ "$REF_TYPE" == branch && "$REF_NAME" == main ]] && [[ "$EVENT_NAME" == push || "$EVENT_NAME" == workflow_dispatch ]]; then
            python deploy/scripts/development_alias.py \
              --event-name "$EVENT_NAME" --ref-type "$REF_TYPE" --ref-name "$REF_NAME" \
              --version "$VERSION" --digest "$digest" --sha "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "Published and signed $registry/ilm-helm/mcp-server@$digest" >> "$GITHUB_STEP_SUMMARY"

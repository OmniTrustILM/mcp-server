apiVersion: v1
kind: Service
metadata:
  name: {{ default (include "mcp-server.fullname" .) .Values.service.name | quote }}
  labels: {{- include "mcp-server.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "mcp-server.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http

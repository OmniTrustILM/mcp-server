spring:
  application:
    name: ilm-mcp-server
  ai:
    mcp:
      server:
        name: ilm-mcp-server
        version: 0.1.0
        type: SYNC
        annotation-scanner:
          enabled: false
        tool-callback-converter: false
        instructions: >
          Access to an ILM platform: certificates, keys, secrets, signing, CBOMs and cryptographic assets.
          This server runs with access level ${ilm.mcp.access}. At read-only it offers only tools that read; read-write
          adds tools that create and change, and full adds tools that delete, revoke or destroy. Tools above the
          access level are not available; the operator sets the level with ILM_MCP_ACCESS.
          For post-quantum (PQC) readiness questions start with get_crypto_asset_statistics, then use
          search_crypto_assets filtered by PQC verdict, and explain_crypto_asset_pqc_verdict for a single asset.
          Call get_searchable_fields for a resource type before filtering its search.
          Tools that need an ILM newer than 2.17 name their minimum version and say so when the connected ILM is older.

ilm:
  mcp:
    access: ${ILM_MCP_ACCESS:read-only}
    toolsets: ${ILM_MCP_TOOLSETS:all}
  api:
    url: ${ILM_API_URL:https://localhost/api}
    auth:
      method: ${ILM_AUTH_METHOD:certificate}
      ssl-bundle: ${ILM_SSL_BUNDLE:ilm-client}
      oauth:
        client-id: ${ILM_OAUTH_CLIENT_ID:}
        client-secret: ${ILM_OAUTH_CLIENT_SECRET:}
        token-url: ${ILM_OAUTH_TOKEN_URL:}
        scope: ${ILM_OAUTH_SCOPE:}
        audience: ${ILM_OAUTH_AUDIENCE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

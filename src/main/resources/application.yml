spring:
  application:
    name: ilm-mcp-server
  ai:
    mcp:
      server:
        name: ilm-mcp-server
        version: 0.1.0
        type: SYNC
        annotation-scanner:
          enabled: false
        tool-callback-converter: false
        instructions: >
          Access to ILM inventory, configuration and lifecycle operations: certificates, keys/tokens, connectors, vaults,
          secrets, authorities/RA profiles, enrollment, users/permissions, discovery, compliance/approvals, attributes,
          signing/timestamping, scheduler/platform settings, CBOMs and cryptographic assets.
          This server runs with access level ${ilm.mcp.access}. At read-only it offers only tools that read; read-write
          adds tools that create and change, and full adds tools that delete, revoke or destroy. Tools above the
          access level are not available; the operator sets the level with ILM_MCP_ACCESS.
          Private key/keystore exports, secret content, ACME EAB keys and proxy provisioning instructions are returned only
          through explicit full-access tools. Ordinary responses omit protected material. Retrieve provider attribute
          schemas before configuration writes; updates retain readable values and require fresh protected values.
          To automate something, describe the goal: create_trigger sets up a whole workflow in one call and attaches it
          to its event, and list_event_triggers shows what already happens on an event. list_trigger_fields shows the
          fields a trigger can check and set; look up names with list_users, list_roles and list_groups, and create a
          missing group or custom attribute first with create_group or create_custom_attribute.
          For notifications, list_connectors shows notification connectors and their kinds, and
          get_notification_connector_settings shows what an instance needs; create a missing notification instance or
          profile with create_notification_instance or create_notification_profile, then pass the profile to
          create_trigger.
          For post-quantum (PQC) readiness questions start with get_crypto_asset_statistics, then use
          search_crypto_assets filtered by PQC verdict, and explain_crypto_asset_pqc_verdict for a single asset.
          Call get_searchable_fields for a resource type before filtering its search.
          Tools that need an ILM newer than 2.17 name their minimum version and say so when the connected ILM is older.

ilm:
  mcp:
    access: ${ILM_MCP_ACCESS:read-only}
    toolsets: ${ILM_MCP_TOOLSETS:all}
  api:
    url: ${ILM_API_URL:https://localhost/api}
    auth:
      method: ${ILM_AUTH_METHOD:certificate}
      ssl-bundle: ${ILM_SSL_BUNDLE:ilm-client}
      oauth:
        client-id: ${ILM_OAUTH_CLIENT_ID:}
        client-secret: ${ILM_OAUTH_CLIENT_SECRET:}
        token-url: ${ILM_OAUTH_TOKEN_URL:}
        scope: ${ILM_OAUTH_SCOPE:}
        audience: ${ILM_OAUTH_AUDIENCE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
